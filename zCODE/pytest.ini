[pytest]
testpaths = tests/unit
python_files = test_*.py
python_functions = test_*
markers =
    unit: pruebas unitarias
    functional: pruebas funcionales (reglas de negocio)
    integration: pruebas de integracion
    regression: pruebas de regresion
addopts = -v --tb=short --strict-markers --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=html --cov-fail-under=90
